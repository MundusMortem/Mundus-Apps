<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0e" />
  <meta name="description" content="Mundus Apps" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="install.css" />
  <title>Mundus Apps</title>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <header>
    <a class="brand" href="./" aria-label="Mundus Apps home"><span class="brand-mark" aria-hidden="true">M</span>Mundus Apps</a>
    <button class="install-button" id="installButton" type="button">Install</button>
  </header>
  <main>
    <section class="library" aria-labelledby="apps-heading">
      <div class="emblem" aria-hidden="true">M</div>
      <div class="section-heading"><h1 id="apps-heading">Apps<span class="period">.</span></h1><button id="refreshButton" type="button">Refresh</button></div>
      <p id="catalogStatus" role="status">Loading apps…</p>
      <div class="app-grid" id="appGrid"></div>
      <div id="emptyState" class="empty-state" hidden><p>No apps yet.</p><p>Build apps in ChatGPT.</p></div>
    </section>
  </main>
  <script type="module" src="app.js?v=9"></script>
</body>
</html>
