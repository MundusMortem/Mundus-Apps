name: Refresh Reports news
on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - apps/reports/config.json
      - scripts/reports_collect.py
      - .github/workflows/reports-news.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reports-news
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test news collector
        run: python3 -m unittest discover -s tests -p 'test_reports.py'
      - name: Collect current news
        run: python3 scripts/reports_collect.py
      - name: Preserve the latest briefing
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/reports/data.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh Reports news briefing'
          git push origin HEAD:main
